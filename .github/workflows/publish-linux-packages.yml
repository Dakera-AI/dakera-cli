name: Publish Linux Packages

on:
  push:
    tags:
      - '*-?[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and republish (for example v0.8.0). Defaults to the selected ref.'
        required: false
        type: string
      rpm_only:
        description: 'Only republish the RPM repository (skip the APT repository)'
        required: false
        type: boolean
        default: false

env:
  RELEASE_REF: ${{ inputs.tag || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: publish-linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build .deb package
    if: ${{ !inputs.rpm_only }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deb-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb package
        run: |
          rm -rf target/debian/
          cargo deb
      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: target/debian/*.deb

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rpm-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release
      - name: Build .rpm package
        run: |
          rm -rf target/generate-rpm/
          cargo generate-rpm
      - name: Upload rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: target/generate-rpm/*.rpm

  publish-apt:
    name: Publish to APT repository
    if: ${{ !inputs.rpm_only }}
    needs: build-deb
    runs-on: ubuntu-22.04
    steps:
      - name: Download deb artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: ./debs

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Checkout apt-repo
        uses: actions/checkout@v7
        with:
          repository: dakera-ai/apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Install APT repo tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Add package and regenerate index
        run: |
          set -euo pipefail
          DEB=$(ls ./debs/*.deb | head -1)
          echo "Processing: $DEB"

          # Place deb in pool
          mkdir -p apt-repo/pool/main/d/dk/
          cp "$DEB" apt-repo/pool/main/d/dk/

          # Create Packages index
          mkdir -p apt-repo/dists/stable/main/binary-amd64/
          cd apt-repo
          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip  -k -f dists/stable/main/binary-amd64/Packages
          xz    -k -f dists/stable/main/binary-amd64/Packages

          # Generate Release file
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Dakera AI" \
            -o APT::FTPArchive::Release::Label="Dakera" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Dakera AI CLI packages" \
            release dists/stable/ > dists/stable/Release

          # Sign the Release file
          gpg --batch --yes -u hello@dakera.ai \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes -u hello@dakera.ai \
            -abs -o dists/stable/Release.gpg dists/stable/Release

          echo "APT repo updated successfully"

      - name: Commit and push
        run: |
          cd apt-repo
          git config user.email "platform@dakera.ai"
          git config user.name "Dakera Platform Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            VERSION="${RELEASE_TAG}"
            git commit -m "feat: add dk ${VERSION} packages"
            git push
          fi

  publish-rpm:
    name: Publish to RPM repository
    needs: build-rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Download rpm artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: ./rpms

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Checkout rpm-repo
        uses: actions/checkout@v7
        with:
          repository: dakera-ai/rpm-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: rpm-repo

      - name: Install createrepo_c and rpm tooling
        run: sudo apt-get install -y createrepo-c rpm

      - name: Sign packages, regenerate and sign metadata
        env:
          GPG_FPR: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          RPM=$(ls ./rpms/*.rpm | head -1)
          echo "Processing: $RPM"

          mkdir -p rpm-repo/packages/
          cp "$RPM" rpm-repo/packages/

          # Non-interactive rpm signing set-up (the same key as the APT repo).
          cat > "$HOME/.rpmmacros" <<EOF
          %_gpg_name hello@dakera.ai
          %__gpg /usr/bin/gpg
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback
          EOF
          sed -i 's/^ *//' "$HOME/.rpmmacros"

          # Publish the public key that users import.
          gpg --armor --export "$GPG_FPR" > rpm-repo/RPM-GPG-KEY-dakera

          # Sign every package in the repository BEFORE generating metadata,
          # so that gpgcheck=1 works for all versions that can be installed.
          rpmsign --addsign rpm-repo/packages/*.rpm

          # Verify with a clean rpm database that only trusts the published key.
          DBPATH=$(mktemp -d)
          rpm --dbpath "$DBPATH" --import rpm-repo/RPM-GPG-KEY-dakera
          for f in rpm-repo/packages/*.rpm; do
            out=$(rpm --dbpath "$DBPATH" -K "$f")
            echo "$out"
            echo "$out" | grep -q "digests signatures OK"
          done

          # Regenerate all repository metadata
          createrepo_c --update rpm-repo/

          # Sign the repository metadata so dnf/yum clients can verify integrity
          gpg --batch --yes -u hello@dakera.ai \
            -abs -o rpm-repo/repodata/repomd.xml.asc rpm-repo/repodata/repomd.xml

          echo "RPM repo updated and signed successfully"

      - name: Commit and push
        run: |
          cd rpm-repo
          git config user.email "platform@dakera.ai"
          git config user.name "Dakera Platform Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            VERSION="${RELEASE_TAG}"
            git commit -m "feat: add dk ${VERSION} packages"
            git push
          fi
